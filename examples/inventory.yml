# Exemple d'inventaire beryl.
#
# Copiez ce fichier dans `inventory.yml` à la racine du projet (ou
# utilisez `beryl -i examples/inventory.yml <commande>`).

defaults:
  user: root
  port: 22
  identity_file: ~/.ssh/id_ed25519

  # Paramètres du bootstrap (optionnel). Depuis ADR-011, la voie
  # principale est QEMU-in-rescue : aucune clé d'inventaire n'est
  # nécessaire, `beryl bootstrap` prend `--iso-url` et `--freebsd-version`
  # au CLI si besoin d'overrider. La clé `mfsbsd_image_url` reste lue
  # pour compat ascendante mais n'est plus utilisée par le flux courant.
  # bootstrap:
  #   mfsbsd_image_url: https://depenguin.me/files/mfsbsd-15.0-RELEASE-amd64.iso

hosts:
  # Serveur OVH dédié en rescue Debian.
  #
  # Les champs sous `ovh:` sont utilisés par `beryl rescue` pour piloter
  # le panneau via l'API OVH (bascule en rescue + injection clé SSH +
  # reboot). Les trouver dans le manager OVH :
  #
  #  * service_name : « Nom du service » affiché sous le serveur
  #    (forme `ns1234.ip-1-2-3.eu`, `kimsufi-xxx.kimsufi.com`…).
  #  * ssh_key_name : nom d'une clé SSH déjà déclarée dans « Mes clés »
  #    du compte OVH. Créer d'abord la clé côté OVH si nécessaire.
  web01.aloli.fr:
    provider: ovh
    ovh:
      service_name: ns1234567.ip-51-83-6.eu
      ssh_key_name: philippe-aloli-fr
    recipes:
      - core-system
      - nginx-crystal-deploy

    # Bloc `freebsd:` (optionnel) — consommé par `beryl bootstrap` pour
    # éviter d'avoir à passer toutes les options en ligne de commande.
    # Les flags CLI (--disk, --raid, --authorized-keys, …) priment sur
    # ces valeurs. Règle Aloli « no silent defaults » : un champ absent
    # reste absent, pas de magie. Pour un exemple plus fourni (users,
    # packages, sudoers) voir `loulou.aloli.net` plus bas.
    freebsd:
      hostname: web01
      disks: [/dev/sda]
      raid: stripe              # stripe|mirror|raidz|raidz2|raidz3
      install_type: distribution_sets  # distribution_sets|packages (pkgbase, opt-in)
      timezone: Europe/Paris
      pool_name: zroot
      swap_gb: 4

  # Dedibox Scaleway en rescue Ubuntu.
  #
  # Les champs sous `scaleway:` sont utilisés par `beryl rescue` :
  #
  #  * zone      : zone Elastic Metal du serveur (fr-par-2 par défaut,
  #                voir `ScalewayApi::ZONES`).
  #  * server_id : UUID du serveur Elastic Metal (onglet « Informations »
  #                de la console Scaleway).
  web02.scaleway.aloli.fr:
    provider: scaleway
    scaleway:
      zone: fr-par-2
      server_id: 11111111-2222-3333-4444-555555555555
    user: root
    port: 22
    recipes:
      - core-system

  # Hôte générique (autre hébergeur, VM locale UTM, etc.).
  # Pas de bascule rescue automatique : beryl rescue refusera ce provider.
  db01.aloli.fr:
    provider: generic
    port: 2222
    recipes:
      - core-system
    variables:
      timezone: Europe/Paris

  # Exemple complet d'un serveur Rails (RAID 0 ZFS, admin + deploy users,
  # packages base et sudoers). À consommer par `beryl bootstrap` :
  #
  #   beryl bootstrap loulou.aloli.net
  #
  # Sans flag CLI — tout est dans le YAML. Les clés SSH inline dans
  # `users[].ssh_keys` sont injectées dans `~/.ssh/authorized_keys` du
  # user correspondant sur le FreeBSD posé. Pour forcer une clé unique
  # (tous users) depuis un fichier, ajouter `--authorized-keys=FILE`.
  loulou.aloli.net:
    provider: ovh
    ovh:
      service_name: ns3156789.ip-51-83-6.eu
      ssh_key_name: philippe-aloli-fr

    freebsd:
      hostname: loulou
      timezone: Europe/Paris
      pool_name: zroot
      swap_gb: 4
      disks: [/dev/sda]
      raid: stripe
      install_type: distribution_sets
      users:
        - name: admin
          primary_group: www
          secondary_groups: [wheel]
          shell: /bin/csh
          ssh_keys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExample philippe@aloli.fr
        - name: deploy
          primary_group: www
          secondary_groups: []
          shell: /bin/csh
          ssh_keys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExample deploy@aloli.fr
      packages:
        - sudo
        - zsh
        - curl
      sudoers:
        - '%wheel ALL=(ALL) NOPASSWD:ALL'
