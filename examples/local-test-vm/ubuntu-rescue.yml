# Configuration d'une VM Ubuntu 24.04 LTS server live pour simuler localement
# un rescue d'hébergeur (OVH, Scaleway, etc.) avant un bootstrap beryl.
#
# Variante Ubuntu de debian-rescue.yml : utile pour tester les chemins de
# détection quand l'hébergeur fournit un rescue Ubuntu.
#
# Consommée par `./launch.sh ubuntu-rescue.yml` (QEMU direct).
# Le port de forward SSH diffère (2223) pour pouvoir tourner en parallèle
# de debian-rescue.yml.

name: ubuntu-rescue
description: Ubuntu 24.04 LTS server live — rescue Linux simulé pour `beryl bootstrap`.

arch: x86_64

resources:
  ram_mb: 4096
  cpus: 2
  disk_gb: 40

iso: ~/iso-linux/ubuntu-24.04.4-live-server-amd64.iso

firmware: uefi

disk:
  image: ~/vms/ubuntu-rescue.qcow2
  format: qcow2

network:
  mode: user
  ssh_port_forward: 2223 # différent de Debian (2222) pour cohabitation

display: gui

boot_mode: cdrom-once

# Seed cloud-init (optionnel) : si présent, est attaché comme 2ᵉ cdrom.
# Pointe vers le chemin par défaut de `beryl bake-seed` (= tmp/seed.img
# à la racine du projet beryl, non suivi par git).
#
# Générez-le (une seule fois, ou à chaque changement de clé) avec :
#   beryl bake-seed
#
# ATTENTION : cette ISO est une ISO d'installation Ubuntu (subiquity),
# pas un live minimaliste. Elle posera plusieurs questions à l'écran.
# Le seed cloud-init n'est pas idéal ici : envisagez l'approche « image
# cloud » (qcow2 directement bootable) plutôt que l'ISO live-server.
# Voir IDEAS.adoc § « Génération d'ISO préprovisionnées ».
seed_iso: tmp/seed.img
