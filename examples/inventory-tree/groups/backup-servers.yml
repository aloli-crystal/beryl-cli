# Défauts pour les serveurs de sauvegarde.
#
# Typiquement : un SSD rapide pour le système, plusieurs disques
# rotatifs pour les archives. L'hôte définit les disques effectifs.

freebsd:
  timezone: Europe/Paris
  pool_name: zroot
  swap_gb: 8
  install_type: distribution_sets

  packages:
    - sudo
    - zsh
    - curl
    - git
    - rsync
    - restic
    - borgbackup

  sudoers:
    - '%wheel ALL=(ALL) NOPASSWD:ALL'
