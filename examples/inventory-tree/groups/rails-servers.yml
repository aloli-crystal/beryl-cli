# Valeurs par défaut pour les serveurs Rails Aloli.
#
# Appliquées aux hôtes qui listent `rails-servers` dans leur champ
# `groups:`. Un host peut redéfinir n'importe quel champ (les scalaires
# sont overridés, les listes remplacées intégralement pour rester
# prévisible).

freebsd:
  timezone: Europe/Paris
  pool_name: zroot
  swap_gb: 4
  raid: stripe   # RAID 0 ZFS (feedback Aloli : backups bétonnés > redondance disque)
  install_type: distribution_sets

  # Packages Rails : ruby + outils de build natif, BD locale, serveur web.
  packages:
    - sudo
    - zsh
    - curl
    - git
    - ruby
    - rubygem-bundler
    - postgresql16-server
    - postgresql16-client
    - node
    - nginx

  # Règle NOPASSWD posée sur wheel pour que `admin` puisse faire du
  # `sudo -n` (utilisé par `beryl apply`). Voir feedback_beryl_no_root_ssh.md
  # pour le design général.
  sudoers:
    - '%wheel ALL=(ALL) NOPASSWD:ALL'
