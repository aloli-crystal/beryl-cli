# Serveur de sauvegarde — SSD pour le système, 4 HDD pour les archives.
#
# Le pool ZFS inclut les 5 disques en stripe. Si vous voulez des pools
# séparés (zroot sur le SSD, zarchive sur les HDD), ce sera une
# itération future : pour l'instant, beryl pose un seul pool.

provider: ovh
ovh:
  service_name: ns4242424.ip-91-134-0.eu
  # ssh_key_name : hérité de `groups/aloli-net.yml` (même zone partagée).

groups:
  - aloli-net       # zone DNS + ssh_key_name
  - aloli-admin
  - backup-servers

freebsd:
  hostname: backup01
  # 5 disques : /dev/sda = SSD système, /dev/sdb..sde = HDD data.
  # En stripe ZFS pur, tout est agrégé. À raffiner (pool séparé data)
  # dans une itération future quand multi-pool sera supporté.
  disks:
    - /dev/sda
    - /dev/sdb
    - /dev/sdc
    - /dev/sdd
    - /dev/sde
  raid: stripe
