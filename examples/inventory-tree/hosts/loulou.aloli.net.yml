# Serveur Rails de prod — hérite `rails-servers` + `aloli-admin`.
#
# Le nom du fichier (`loulou.aloli.net.yml`) donne le nom de l'hôte :
# `beryl bootstrap loulou.aloli.net`.

provider: ovh
ovh:
  service_name: ns3156789.ip-51-83-6.eu
  # ssh_key_name : hérité de `groups/aloli-net.yml` (zone partagée).
  # Pour une clé spécifique à loulou, décommentez :
  #   ssh_key_name: autre-cle-OVH

groups:
  - aloli-net       # zone DNS + ssh_key_name partagée
  - aloli-admin     # user admin standard
  - rails-servers   # stack Rails

freebsd:
  hostname: loulou
  disks: [/dev/sda]
  # Tout le reste (timezone, packages, sudoers, users, raid, swap,
  # install_type) vient des groupes. Pour ajouter un package
  # spécifique à loulou, redéfinissez `packages:` ici — ça remplace
  # intégralement la liste du groupe (pattern « redéfinie par le
  # fichier du serveur au besoin »).
