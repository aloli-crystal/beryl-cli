name: beryl
version: 0.1.3

description: >
  Outil Crystal de gestion de configuration FreeBSD, agentless SSH.
  Provisionne des serveurs FreeBSD 15 (bootstrap via mfsBSD depuis un rescue Linux),
  puis applique des recettes idempotentes (pkg, service, user, sshd, nginx, etc.).

authors:
  - ALOLI sas <philippe@aloli.fr>

crystal: ">= 1.19.1"

license: MIT

dependencies:
  silex:
    github: aloli-crystal/crystal-silex
    branch: production
  ovh-api:
    github: aloli-crystal/crystal-api-ovh
    branch: production
  scaleway-api:
    github: aloli-crystal/crystal-api-scaleway
    branch: production
  load-env:
    github: aloli-crystal/crystal-load-env
    branch: production

targets:
  beryl:
    main: src/beryl/cli.cr
