name: beryl
version: 0.6.125

description: >
  Outil Crystal de gestion de configuration FreeBSD, agentless SSH.
  Provisionne des serveurs FreeBSD 15 (bootstrap via mfsBSD depuis un rescue Linux),
  puis applique des recettes idempotentes (pkg, service, user, sshd, nginx, etc.).

authors:
  - ALOLI sas <philippe@aloli.fr>

crystal: ">= 1.19.1"

license: MIT

dependencies:
  api-dedibox:
    github: aloli-crystal/api-dedibox
    branch: production
  api-gandi:
    github: aloli-crystal/api-gandi
    branch: production
  api-ovh:
    github: aloli-crystal/api-ovh
    branch: production
  api-scaleway:
    github: aloli-crystal/api-scaleway
    branch: production
  load-env:
    github: aloli-crystal/load-env
    branch: production
  secrets:
    github: aloli-crystal/secrets
    branch: production
  session-log:
    github: aloli-crystal/session-log
    branch: production
  silex:
    github: aloli-crystal/silex
    branch: production
  ssh:
    github: aloli-crystal/ssh
    branch: production
  yaml-tidy:
    github: aloli-crystal/yaml-tidy
    branch: production

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.7"

targets:
  beryl:
    main: src/beryl/cli.cr
