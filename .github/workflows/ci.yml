name: CI

on:
  push:
    branches: [production, development]
  pull_request:
    branches: [production, development]

jobs:
  lint:
    name: Format Crystal
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.22.0
    steps:
      - uses: actions/checkout@v4
      - name: Vérifie le formatage
        run: crystal tool format --check src/ spec/

  spec-linux:
    name: Specs (Linux)
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.22.0
    steps:
      - uses: actions/checkout@v4
      - name: Installe les shards
        run: shards install
      - name: Compile
        run: shards build
      - name: Ameba (linter)
        # ameba >= 1.7 ne compile plus son exécutable à l'installation (plus
        # de postinstall, ni de bin/ameba.cr généré) : on le compile depuis son
        # point d'entrée. `bin/` n'est pas versionné.
        run: crystal build lib/ameba/src/cli.cr -o bin/ameba && bin/ameba
      - name: Prépare les fixtures .env.yml (copie des .sample)
        # Les fixtures secrets-like sont versionnées en .env.yml.sample
        # (valeurs bidon xxx/yyy/zzz) ; beryl les cherche sous leur
        # nom final `.env.yml` qui est dans le gitignore pour éviter
        # qu'un vrai secret soit commité par erreur.
        run: find spec/fixtures -name ".env.yml.sample" -exec sh -c 'cp "$1" "${1%.sample}"' _ {} \;
      - name: Exécute les specs
        run: crystal spec

  spec-freebsd:
    name: Specs (FreeBSD 15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lance les specs dans une VM FreeBSD 15
        uses: cross-platform-actions/action@v1.0.0
        with:
          operating_system: freebsd
          version: '15.0'
          shell: sh
          run: |
            sudo pkg install -y crystal shards
            shards install
            shards build
            find spec/fixtures -name ".env.yml.sample" -exec sh -c 'cp "$1" "${1%.sample}"' _ {} \;
            crystal spec
